version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file:
      - .env.docker
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres_data:
