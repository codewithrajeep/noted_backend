name: CI # name of the workflow (Continuous Integration)

on:
  push: # trigger on push events
    branches: [main, development] # trigger on main and development branches
  pull_request: # trigger on pull request events
    branches: [main, development] # trigger on main and development branches

jobs:
  build: # job name
    runs-on: ubuntu-latest # runner environment (Ubuntu)

    steps:
      - name: Checkout code # step name
        uses: actions/checkout@v3 # action to use

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build
        run: pnpm run build

  auto-merge: # job name
    needs: build # job dependency
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest # runner environment (Ubuntu)

    steps:
      - name: Checkout code # step name
        uses: actions/checkout@v3 # action to use
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # GitHub token
          fetch-depth: 0 # fetch all branches and tags

      - name: Merge development into main # step name
        run: | # run command
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge development --no-ff -m "ci: auto-merge development into main"
          git push origin main
