name: CI # name of the workflow (Continuous Integration)

on: # triggers
  push:
    branches: [main]

jobs:
  build: # job name
    runs-on: ubuntu-latest # runner environment (Ubuntu)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build
        run: pnpm run build
